# ============================================================
# MIDEA / CASTORAMA — v2.0.0-rc4 (IN TESTING)
# ESP32-C3 Super Mini + ESPHome
#
# Stable release remains v1.5.
# This RC contains the simplified synchronization logic tested on the
# second assembly / 7000 BTU unit. It is not promoted to stable yet.
#
# v2.0.0-rc4 additional behavior:
# - ESP remembers the last real non-OFF operating mode
# - generic OFF -> HEAT_COOL/AUTO power-on is reinterpreted locally as
#   "restore last mode"; no HA/Alice helper entities or automations required
# - RC2 temperature defaults remain: HEAT starts at 30°C, COOL at 25°C
# - ESPHome OTA is encrypted using the existing API encryption key
#
# v2.0.0-rc4 principles:
# - keep native ESPHome Coolix TX on GPIO6 through the existing MOSFET;
# - wait for an actually accepted ON command before restoring B5F5A5 mute;
# - use accepted DISPLAY -> MAIN AA 91 commands for stock-remote sync;
# - use compact AA 91 07 echoes from our own TX as ACK, not as a competing
#   climate-state source;
# - do not let the old 55 90/91 state parser overwrite climate state;
# - no retry hacks, no triple-send, no DIRECT/FIX2/FIX3 control branch.
#
# Hardware mapping on the TESTED SECOND HARNESS:
# GPIO20 = DISPLAY -> MAIN accepted command stream (AA 91...)
# GPIO4  = MAIN -> DISPLAY state stream (55...), not authoritative in this RC
# GPIO6  = Coolix injection via A09T/AO3400-type N-MOSFET
#
# IMPORTANT: GPIO20/GPIO4 here describe the actual signals seen on the
# tested second ESP harness. Treat this as a harness mapping, not proof that
# the two air conditioners have different factory pinouts.
# ============================================================

esphome:
  name: wifi-air-conditioner
  friendly_name: Wifi air conditioner

  # Publish the already-restored mute preference only after all components
  # are initialized. This does not send any command to the air conditioner.
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(mute_switch).publish_state(id(mute_desired));
            ESP_LOGI("AC", "Boot: mute preference published as %s",
                     id(mute_desired) ? "ON" : "OFF");

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

  # A Home Assistant restart must not change the preference.
  # Reconnection only republishes the local persistent value.
  on_client_connected:
    - lambda: |-
        id(mute_switch).publish_state(id(mute_desired));
        ESP_LOGI("AC", "API reconnect: mute preference re-published as %s",
                 id(mute_desired) ? "ON" : "OFF");

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "AC Fallback"
    password: !secret fallback_ap_password

captive_portal:

# ============================================================
# CONFIRMED / REMEMBERED STATE
#
# confirmed_mode:
#   0 = OFF
#   1 = AUTO / HEAT_COOL
#   2 = COOL
#   3 = HEAT
#   4 = FAN_ONLY
#   5 = DRY
#
# confirmed_fan / preferred_fan:
#   0 = AUTO
#   1 = LOW
#   2 = MEDIUM
#   3 = HIGH
# ============================================================

globals:
  - id: confirmed_mode
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  - id: confirmed_temperature
    type: float
    restore_value: yes
    initial_value: '24.0'

  - id: confirmed_fan
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  - id: preferred_fan
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  - id: confirmed_swing
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Last real non-OFF operating mode:
  # 1 = AUTO / HEAT_COOL
  # 2 = COOL
  # 3 = HEAT
  # 4 = FAN_ONLY
  # 5 = DRY
  #
  # OFF never erases this value.
  - id: last_active_mode
    type: uint8_t
    restore_value: yes
    initial_value: '2'


  # Persistent user preference. True means: after each real power-on,
  # disable front display / buzzer with the proven Coolix toggle B5F5A5.
  - id: mute_desired
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Runtime physical state for the current AC ON session.
  # Cleared on every real OFF. Set when we send/observe B5F5A5 while ON.
  - id: mute_active
    type: bool
    restore_value: no
    initial_value: 'false'

  # True only while our own B5F5A5 transmission is awaiting confirmation
  # on the DISPLAY -> MAIN command stream. Prevents treating our echo as external.
  - id: mute_tx_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # Retained from the v1.5 mute state model. The old 55-state decoder is
  # not an authoritative climate-state source in this RC.
  - id: mute_ignore_zero_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ============================================================
# IR INJECTION
# ============================================================

remote_transmitter:
  id: ac_ir_tx

  pin:
    number: GPIO6
    inverted: false

  carrier_duty_percent: 100%

# ============================================================
# DISPLAY / SOUND
# ============================================================
# B5F5A5 is a proven TOGGLE. The AC resets its mute state on a real OFF -> ON,
# so one startup beep is unavoidable on this hardware revision. If the user
# preference is ON, mute is restored exactly once after the new ON state is
# confirmed. No repeated B5 is sent on mode/fan/temp changes.
# ============================================================

script:
  - id: reapply_mute_after_power_on
    mode: restart
    then:
      - delay: 700ms
      - if:
          condition:
            lambda: |-
              return
                id(mute_desired) &&
                !id(mute_active) &&
                id(ac_climate)->mode != climate::CLIMATE_MODE_OFF;
          then:
            - lambda: |-
                id(mute_active) = true;
                id(mute_tx_pending) = true;
                id(mute_ignore_zero_until_ms) = millis() + 1500;
                ESP_LOGI("AC", "Persistent mute: re-applying B5F5A5 after power-on");
            - remote_transmitter.transmit_coolix:
                transmitter_id: ac_ir_tx
                first: 0xB5F5A5

switch:
  - platform: template
    id: mute_switch
    name: "Без звука"

    # CRITICAL: the preference is owned by mute_desired.
    # With the normal switch restore behavior, TemplateSwitch::setup() can
    # execute turn_off_action during boot and overwrite restored mute_desired.
    # DISABLED prevents any boot-time ON/OFF action; lambda below publishes
    # the canonical value instead.
    restore_mode: DISABLED

    lambda: |-
      return id(mute_desired);

    turn_on_action:
      - lambda: |-
          id(mute_desired) = true;
          id(mute_switch).publish_state(true);

      - if:
          condition:
            lambda: |-
              return
                id(ac_climate)->mode != climate::CLIMATE_MODE_OFF &&
                !id(mute_active);
          then:
            - lambda: |-
                id(mute_active) = true;
                id(mute_tx_pending) = true;
                id(mute_ignore_zero_until_ms) = millis() + 1500;
                ESP_LOGI("AC", "Mute enabled while AC is ON; sending B5F5A5 once");
            - remote_transmitter.transmit_coolix:
                transmitter_id: ac_ir_tx
                first: 0xB5F5A5
          else:
            - lambda: |-
                ESP_LOGI("AC", "Mute preference enabled while AC is OFF; armed for next power-on");

    turn_off_action:
      - lambda: |-
          id(mute_desired) = false;
          id(mute_switch).publish_state(false);

      - if:
          condition:
            lambda: |-
              return
                id(ac_climate)->mode != climate::CLIMATE_MODE_OFF &&
                id(mute_active);
          then:
            - lambda: |-
                id(mute_active) = false;
                id(mute_tx_pending) = true;
                id(mute_ignore_zero_until_ms) = millis() + 1500;
                ESP_LOGI("AC", "Mute disabled while AC is ON; sending B5F5A5 once");
            - remote_transmitter.transmit_coolix:
                transmitter_id: ac_ir_tx
                first: 0xB5F5A5
          else:
            - lambda: |-
                id(mute_active) = false;
                id(mute_tx_pending) = false;
                ESP_LOGI("AC", "Mute preference disabled; no toggle needed while AC is OFF");

# ============================================================
# CLIMATE
# ============================================================

climate:
  - platform: coolix

    id: ac_climate
    name: "Кондиционер"

    transmitter_id: ac_ir_tx

    supports_cool: true
    supports_heat: true

    visual:
      min_temperature: 17
      max_temperature: 30
      temperature_step: 1

    # --------------------------------------------------------
    # User-control corrections before Coolix packet is sent.
    #
    # 1) Remember fan speed in normal fan-controllable modes.
    # 2) On a pure mode change, inject remembered fan speed.
    # 3) Any entry into HEAT = 30°C.
    # 4) Any entry into COOL = 25°C.
    #    This only sets the initial target on mode entry;
    #    the temperature remains freely adjustable afterwards.
    #
    # AUTO/DRY in Coolix physically use AUTO fan. We do not
    # overwrite preferred_fan there, so the previous speed is
    # restored after leaving AUTO/DRY.
    # --------------------------------------------------------

    on_control:
      - lambda: |-
          auto requested_mode = x.get_mode();
          auto requested_fan = x.get_fan_mode();

          climate::ClimateMode effective_mode = id(ac_climate)->mode;
          if (requested_mode.has_value())
            effective_mode = *requested_mode;

          // If user explicitly changes fan in COOL / HEAT / FAN_ONLY,
          // remember that choice.
          if (
            requested_fan.has_value() &&
            (
              effective_mode == climate::CLIMATE_MODE_COOL ||
              effective_mode == climate::CLIMATE_MODE_HEAT ||
              effective_mode == climate::CLIMATE_MODE_FAN_ONLY
            )
          ) {
            switch (*requested_fan) {
              case climate::CLIMATE_FAN_LOW:
                id(preferred_fan) = 1;
                break;

              case climate::CLIMATE_FAN_MEDIUM:
                id(preferred_fan) = 2;
                break;

              case climate::CLIMATE_FAN_HIGH:
                id(preferred_fan) = 3;
                break;

              case climate::CLIMATE_FAN_AUTO:
              default:
                id(preferred_fan) = 0;
                break;
            }
          }

          if (requested_mode.has_value()) {
            climate::ClimateMode old_mode = id(ac_climate)->mode;
            climate::ClimateMode new_mode = *requested_mode;

            // ESP-only power-on semantics:
            // Generic climate.turn_on arrives as OFF -> HEAT_COOL/AUTO.
            // Treat that transition as "power on" and restore the last
            // real non-OFF mode stored locally by the ESP.
            if (
              old_mode == climate::CLIMATE_MODE_OFF &&
              new_mode == climate::CLIMATE_MODE_HEAT_COOL
            ) {
              switch (id(last_active_mode)) {
                case 1:
                  new_mode = climate::CLIMATE_MODE_HEAT_COOL;
                  break;
                case 3:
                  new_mode = climate::CLIMATE_MODE_HEAT;
                  break;
                case 4:
                  new_mode = climate::CLIMATE_MODE_FAN_ONLY;
                  break;
                case 5:
                  new_mode = climate::CLIMATE_MODE_DRY;
                  break;
                case 2:
                default:
                  new_mode = climate::CLIMATE_MODE_COOL;
                  break;
              }

              x.set_mode(new_mode);
              ESP_LOGI(
                "AC",
                "Generic ON from OFF: restoring last mode=%u",
                (unsigned) id(last_active_mode)
              );
            }

            // Remember the final non-OFF mode. OFF never overwrites it.
            switch (new_mode) {
              case climate::CLIMATE_MODE_HEAT_COOL:
                id(last_active_mode) = 1;
                break;
              case climate::CLIMATE_MODE_COOL:
                id(last_active_mode) = 2;
                break;
              case climate::CLIMATE_MODE_HEAT:
                id(last_active_mode) = 3;
                break;
              case climate::CLIMATE_MODE_FAN_ONLY:
                id(last_active_mode) = 4;
                break;
              case climate::CLIMATE_MODE_DRY:
                id(last_active_mode) = 5;
                break;
              default:
                break;
            }

            // Default target temperature whenever entering HEAT / COOL.
            // Includes OFF -> HEAT/COOL and transitions from other modes.
            // This is not a lock: temperature changes inside the active mode
            // are left untouched because this runs only on a mode change.
            if (
              new_mode == climate::CLIMATE_MODE_HEAT &&
              old_mode != climate::CLIMATE_MODE_HEAT
            ) {
              x.set_target_temperature(30.0f);
            }
            else if (
              new_mode == climate::CLIMATE_MODE_COOL &&
              old_mode != climate::CLIMATE_MODE_COOL
            ) {
              x.set_target_temperature(25.0f);
            }

            // In the modes where fan speed is actually selectable,
            // preserve/restore the remembered fan if HA did not send
            // a fan change in this same call.
            if (
              !requested_fan.has_value() &&
              (
                new_mode == climate::CLIMATE_MODE_COOL ||
                new_mode == climate::CLIMATE_MODE_HEAT ||
                new_mode == climate::CLIMATE_MODE_FAN_ONLY
              )
            ) {
              switch (id(preferred_fan)) {
                case 1:
                  x.set_fan_mode(climate::CLIMATE_FAN_LOW);
                  break;

                case 2:
                  x.set_fan_mode(climate::CLIMATE_FAN_MEDIUM);
                  break;

                case 3:
                  x.set_fan_mode(climate::CLIMATE_FAN_HIGH);
                  break;

                default:
                  x.set_fan_mode(climate::CLIMATE_FAN_AUTO);
                  break;
              }
            }

            // --------------------------------------------------
            // MUTE-ONLY FIX FOR UNIT #2
            //
            // The original climate control is left untouched.
            // confirmed_mode on this second unit can lag behind the
            // actual HA/Coolix power transition, so persistent mute
            // was armed but never re-applied after OFF -> ON.
            //
            // We use the explicit HA mode transition only to maintain
            // runtime mute state and schedule the existing B5F5A5 script.
            // --------------------------------------------------

            if (new_mode == climate::CLIMATE_MODE_OFF) {
              id(reapply_mute_after_power_on).stop();
              id(mute_active) = false;
              id(mute_tx_pending) = false;
              id(mute_ignore_zero_until_ms) = 0;
              ESP_LOGI("AC", "Mute runtime reset on explicit HA OFF");
            }
            else if (old_mode == climate::CLIMATE_MODE_OFF) {
              // A real OFF -> ON resets the AC's hardware mute state.
              id(mute_active) = false;
              id(mute_tx_pending) = false;

              if (id(mute_desired)) {
                ESP_LOGI("AC", "HA OFF->ON: mute restore armed; waiting for accepted Coolix command");
              }
            }
          }

# ============================================================
# MAIN -> DISPLAY state line (GPIO4)
# ============================================================
# Passive diagnostics proved that GPIO4 carries the 55 90/91 MAIN-state
# stream on this second ESP harness.
#
# IMPORTANT:
# The old v1.5 55-state decoder is intentionally NOT used as an
# authoritative climate-state source here. On unit #2 it can report
# transient/visual states that previously caused mode/fan/swing rollback.
#
# Climate synchronization is taken from the accepted DISPLAY -> MAIN
# Coolix command stream on GPIO20 instead. GPIO4 is left free for the
# next diagnostic/confirmation stage; working climate logic is untouched.
# ============================================================

# ============================================================
# DISPLAY -> MAIN accepted command stream
# Hardware UART 2400 8N1
# Captures accepted Coolix commands from stock remote and ESP
# ============================================================

uart:
  - id: cn18_display_to_main

    rx_pin:
      number: GPIO20
      inverted: false
      mode:
        input: true
        pullup: false

    baud_rate: 2400
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

    debug:
      direction: RX
      dummy_receiver: true

      after:
        timeout: 20ms

      sequence:
        - lambda: |-
            // -------------------------------------------------
            // Compact 11-byte AA 91 07 frame.
            // Proven on this unit for B5F5A5, OFF and normal Coolix commands.
            // We only consume the cases needed for stable persistent mute;
            // all climate decoding below remains the original v1.2 path.
            // -------------------------------------------------
            if (
              bytes.size() == 11 &&
              bytes[0] == 0xAA &&
              bytes[1] == 0x91 &&
              bytes[2] == 0x07
            ) {
              uint16_t compact_sum = 0;
              for (uint8_t b : bytes)
                compact_sum += b;

              // Invalid compact frame: ignore it completely.
              if (
                (compact_sum & 0xFF) != 0 ||
                ((uint8_t) (bytes[3] ^ bytes[4])) != 0xFF ||
                ((uint8_t) (bytes[5] ^ bytes[6])) != 0xFF ||
                ((uint8_t) (bytes[7] ^ bytes[8])) != 0xFF
              ) {
                return;
              }

              uint32_t compact_code =
                  ((uint32_t) bytes[3] << 16) |
                  ((uint32_t) bytes[5] << 8) |
                  ((uint32_t) bytes[7]);

              // Proven display/sound toggle.
              if (compact_code == 0xB5F5A5) {
                if (id(mute_tx_pending)) {
                  // Our own B5 was actually accepted by DISPLAY.
                  id(mute_tx_pending) = false;

                  ESP_LOGI(
                    "AC",
                    "Display/Sound toggle confirmed; mute is %s",
                    id(mute_active) ? "ON" : "OFF"
                  );
                }
                else if (id(ac_climate)->mode != climate::CLIMATE_MODE_OFF) {
                  // Stock remote / external B5 while the AC is really ON.
                  id(mute_active) = !id(mute_active);
                  id(mute_desired) = id(mute_active);
                  id(mute_switch).publish_state(id(mute_desired));

                  ESP_LOGI(
                    "AC",
                    "External Display/Sound toggle confirmed; mute is %s",
                    id(mute_active) ? "ON" : "OFF"
                  );
                }
                return;
              }

              // OFF must always clear runtime mute.
              if (compact_code == 0xB27BE0) {
                id(confirmed_mode) = 0;
                id(confirmed_swing) = false;
                id(mute_active) = false;
                id(mute_tx_pending) = false;
                id(mute_ignore_zero_until_ms) = 0;

                id(ac_climate)->mode = climate::CLIMATE_MODE_OFF;
                id(ac_climate)->swing_mode = climate::CLIMATE_SWING_OFF;
                id(ac_climate)->publish_state();
                ESP_LOGI("AC", "Accepted compact OFF: 0xB27BE0");
                return;
              }

              // Normal compact command generated by our own ESP.
              // This is an ACK that DISPLAY really decoded the injected Coolix.
              // HA already owns the requested state, so do not overwrite
              // mode/fan/temperature from our own compact echo.
              ESP_LOGI(
                "AC",
                "Accepted compact Coolix: 0x%06lX",
                (unsigned long) compact_code
              );

              if (
                (compact_code & 0xFF0000) == 0xB20000 &&
                id(mute_desired) &&
                !id(mute_active) &&
                id(ac_climate)->mode != climate::CLIMATE_MODE_OFF
              ) {
                ESP_LOGI(
                  "AC",
                  "Accepted ON command; scheduling persistent mute restore"
                );
                id(reapply_mute_after_power_on).execute();
              }

              return;
            }

            if (bytes.size() < 17)
              return;

            if (
              bytes[0] != 0xAA ||
              bytes[1] != 0x91 ||
              bytes[2] != 0x0D
            )
              return;

            uint16_t sum = 0;

            for (uint8_t b : bytes)
              sum += b;

            if ((sum & 0xFF) != 0)
              return;

            if (
              ((uint8_t) (bytes[3] ^ bytes[4])) != 0xFF ||
              ((uint8_t) (bytes[5] ^ bytes[6])) != 0xFF ||
              ((uint8_t) (bytes[7] ^ bytes[8])) != 0xFF
            )
              return;

            if (
              bytes[3] != bytes[9] ||
              bytes[5] != bytes[11] ||
              bytes[7] != bytes[13]
            )
              return;

            uint32_t code =
                ((uint32_t) bytes[3] << 16) |
                ((uint32_t) bytes[5] << 8) |
                ((uint32_t) bytes[7]);

            ESP_LOGI(
              "AC",
              "Accepted Coolix: 0x%06lX",
              (unsigned long) code
            );

            // -------------------------------------------------
            // OFF
            // -------------------------------------------------

            if (code == 0xB27BE0) {
              id(confirmed_mode) = 0;
              id(confirmed_swing) = false;
              id(mute_active) = false;
              id(mute_tx_pending) = false;
              id(mute_ignore_zero_until_ms) = 0;

              id(ac_climate)->mode =
                  climate::CLIMATE_MODE_OFF;

              id(ac_climate)->swing_mode =
                  climate::CLIMATE_SWING_OFF;

              id(ac_climate)->publish_state();
              return;
            }

            // -------------------------------------------------
            // SWING TOGGLE
            // -------------------------------------------------

            if (code == 0xB26BE0) {
              id(confirmed_swing) =
                  !id(confirmed_swing);

              id(ac_climate)->swing_mode =
                  id(confirmed_swing)
                    ? climate::CLIMATE_SWING_VERTICAL
                    : climate::CLIMATE_SWING_OFF;

              id(ac_climate)->publish_state();
              return;
            }

            if ((code & 0xFF0000) != 0xB20000)
              return;

            bool was_off_before_yellow = (id(confirmed_mode) == 0);

            uint32_t fan_bits = code & 0xF000;
            uint8_t mode_bits = code & 0x0C;

            // -------------------------------------------------
            // MODE
            // -------------------------------------------------

            if (mode_bits == 0x0C) {
              id(confirmed_mode) = 3;
            }
            else if (mode_bits == 0x08) {
              id(confirmed_mode) = 1;
            }
            else if (mode_bits == 0x04) {
              if (fan_bits == 0x1000)
                id(confirmed_mode) = 5;
              else
                id(confirmed_mode) = 4;
            }
            else {
              id(confirmed_mode) = 2;
            }

            // Full accepted AA91 frames can come from the stock remote.
            // Keep the ESP's last-mode memory synchronized with the real AC.
            if (id(confirmed_mode) >= 1 && id(confirmed_mode) <= 5) {
              id(last_active_mode) = id(confirmed_mode);
            }

            // -------------------------------------------------
            // FAN
            // -------------------------------------------------

            if (
              fan_bits == 0xB000 ||
              fan_bits == 0x1000
            ) {
              id(confirmed_fan) = 0;
            }
            else if (fan_bits == 0x9000) {
              id(confirmed_fan) = 1;
            }
            else if (fan_bits == 0x5000) {
              id(confirmed_fan) = 2;
            }
            else if (fan_bits == 0x3000) {
              id(confirmed_fan) = 3;
            }

            // Preserve the user's real fan choice from the stock remote
            // or from our own accepted command. Do not erase it in modes
            // that force AUTO fan.
            if (
              id(confirmed_mode) == 2 ||
              id(confirmed_mode) == 3 ||
              id(confirmed_mode) == 4
            ) {
              id(preferred_fan) = id(confirmed_fan);
            }

            // -------------------------------------------------
            // TEMPERATURE
            // -------------------------------------------------

            if (id(confirmed_mode) != 4) {
              uint8_t t = code & 0xF0;

              switch (t) {
                case 0x00:
                  id(confirmed_temperature) = 17;
                  break;

                case 0x10:
                  id(confirmed_temperature) = 18;
                  break;

                case 0x30:
                  id(confirmed_temperature) = 19;
                  break;

                case 0x20:
                  id(confirmed_temperature) = 20;
                  break;

                case 0x60:
                  id(confirmed_temperature) = 21;
                  break;

                case 0x70:
                  id(confirmed_temperature) = 22;
                  break;

                case 0x50:
                  id(confirmed_temperature) = 23;
                  break;

                case 0x40:
                  id(confirmed_temperature) = 24;
                  break;

                case 0xC0:
                  id(confirmed_temperature) = 25;
                  break;

                case 0xD0:
                  id(confirmed_temperature) = 26;
                  break;

                case 0x90:
                  id(confirmed_temperature) = 27;
                  break;

                case 0x80:
                  id(confirmed_temperature) = 28;
                  break;

                case 0xA0:
                  id(confirmed_temperature) = 29;
                  break;

                case 0xB0:
                  id(confirmed_temperature) = 30;
                  break;
              }
            }

            // -------------------------------------------------
            // PUBLISH ACCEPTED COMMAND
            // -------------------------------------------------

            switch (id(confirmed_mode)) {
              case 1:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_HEAT_COOL;
                break;

              case 2:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_COOL;
                break;

              case 3:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_HEAT;
                break;

              case 4:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_FAN_ONLY;
                break;

              case 5:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_DRY;
                break;

              default:
                id(ac_climate)->mode =
                    climate::CLIMATE_MODE_OFF;
                break;
            }

            id(ac_climate)->target_temperature =
                id(confirmed_temperature);

            switch (id(confirmed_fan)) {
              case 1:
                id(ac_climate)->fan_mode =
                    climate::CLIMATE_FAN_LOW;
                break;

              case 2:
                id(ac_climate)->fan_mode =
                    climate::CLIMATE_FAN_MEDIUM;
                break;

              case 3:
                id(ac_climate)->fan_mode =
                    climate::CLIMATE_FAN_HIGH;
                break;

              default:
                id(ac_climate)->fan_mode =
                    climate::CLIMATE_FAN_AUTO;
                break;
            }

            id(ac_climate)->swing_mode =
                id(confirmed_swing)
                  ? climate::CLIMATE_SWING_VERTICAL
                  : climate::CLIMATE_SWING_OFF;

            id(ac_climate)->publish_state();

            // Real OFF -> ON accepted on the full stock-remote AA91 frame path.
            // Restore persistent mute once, never on ordinary mode/fan/temp changes.
            if (
              was_off_before_yellow &&
              id(confirmed_mode) != 0 &&
              id(mute_desired) &&
              !id(mute_active)
            ) {
              id(reapply_mute_after_power_on).execute();
            }